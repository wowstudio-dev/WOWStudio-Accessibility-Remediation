# Publish the tag, and tell the website about it.
#
# The website already knows how to update itself: wowstudio-website has a
# "Sync plugin release" workflow that reads this repository's latest GitHub
# release, rewrites src/data/plugin.json and the changelog from it, and opens a
# pull request. It has been running on its daily schedule and finding nothing,
# because two things were missing at this end:
#
#   1. No GitHub release was ever cut. Tags existed; releases did not, and the
#      sync reads /releases/latest.
#   2. Nothing sent the repository_dispatch the sync listens for, so the only
#      path that ever fired was the once-a-day sweep.
#
# The result was a product page stuck on 1.0.0 for four releases, with its only
# call to action pointing at this repository instead of the plugin directory.
#
# So this workflow does exactly two things and leaves the rest to the sync:
# it cuts the release, and it pokes the website.
#
# The dispatch needs a secret named WEBSITE_REPO_TOKEN: a fine-grained personal
# access token with Contents read and write on wowstudio-dev/wowstudio-website.
# Without it the release is still cut and the website picks it up on the next
# daily sweep, a few hours later, rather than immediately.
name: Publish the release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, with the v (e.g. v1.0.5). It must already exist.'
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Cut the release and notify the website
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Read the version and its changelog
        id: rel
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"

          # The directory serves whatever Stable tag names. If the tag being
          # published is not that version, one of the two is wrong, and
          # announcing the wrong number is worse than not announcing.
          STABLE=$(grep -m1 '^Stable tag:' readme.txt | sed 's/.*:[[:space:]]*//' | tr -d '[:space:]')
          if [ "$VERSION" != "$STABLE" ]; then
            echo "::error::Tag $TAG does not match readme.txt Stable tag $STABLE."
            exit 1
          fi

          # Lift this version's section out of the readme changelog. The site's
          # sync uses the release body verbatim, so it is worth being the real
          # notes rather than "see the changelog".
          awk -v want="= $VERSION =" '
            $0 == want { grab = 1; next }
            grab && /^= [0-9]+\.[0-9]+\.[0-9]+ =$/ { exit }
            grab { print }
          ' readme.txt | sed -e '/./,$!d' > /tmp/notes.md

          if [ ! -s /tmp/notes.md ]; then
            echo "::error::No '= $VERSION =' section in the readme changelog."
            exit 1
          fi

          {
            echo ""
            echo "---"
            echo ""
            echo "Install it from the [WordPress Plugin Directory](https://wordpress.org/plugins/wowstudio-accessibility-remediation/)."
          } >> /tmp/notes.md

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cut the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Leaving it alone."
            exit 0
          fi
          gh release create "$TAG" \
            --title "$VERSION" \
            --notes-file /tmp/notes.md \
            --verify-tag

      - name: Tell the website
        env:
          TOKEN: ${{ secrets.WEBSITE_REPO_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning title=Website not notified::WEBSITE_REPO_TOKEN is not set. The site's own daily sweep will pick this release up within 24 hours. To make it immediate, add a fine-grained PAT with Contents read and write on wowstudio-dev/wowstudio-website."
            exit 0
          fi

          curl -sS -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/wowstudio-dev/wowstudio-website/dispatches \
            -d "{\"event_type\":\"plugin-release\",\"client_payload\":{\"tag\":\"$TAG\"}}"

          echo "Dispatched plugin-release for $TAG."
